on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_HOME: ./cache/transformers
      HF_HUB_DISABLE_XET: "1"
      FLAIR_CACHE_ROOT: ./cache/flair
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install Torch cpu
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Flair dependencies
        run: pip install -e .[word-embeddings]
      - name: Install unittest dependencies
        run: pip install -r requirements-dev.txt
      - name: Show installed dependencies
        run: pip freeze
      - name: Cache downloaded models/datasets
        uses: actions/cache@v3
        with:
          path: ./cache
          key: cache-v1.2
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy flair tests
      - name: Run tests
        run: |
          python -c 'import flair'
          pytest --runintegration -vv || [ $? -eq 139 ]
